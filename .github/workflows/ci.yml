name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Pandoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Install Pandoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install pandoc -y --no-progress
          "C:\Program Files\Pandoc" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install package and build tools
        run: python -m pip install -e ".[dev]"
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -q
      - name: Publication boundary check
        run: python scripts/check_release.py
      - name: Build wheel and sdist
        run: python -m build
      - name: Verify installed wheel outside source tree (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m venv /tmp/ai-pdf2epub-wheel
          /tmp/ai-pdf2epub-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/ai-pdf2epub-wheel/bin/bookocr demo --out /tmp/ai-pdf2epub-demo
